[package]
name = "sci-phi"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "SPH fluid simulation program"
repository = "https://github.com/SammyMcFly/fluid-simulation"

[dependencies]
# libcosmic direct dependencies
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.3.2"
rust-embed = "8.8.0"
tokio = { version = "1.48.0", features = ["full"] }

# simulation library
simulation_lib = { path = "../simulation_lib", features = ["default"]}

# backend
sci-phi-backend = { path = "../sci-phi-backend"}

# my rendering library
rendering_lib = { path = "../rendering_lib" , features = ["default"]}

# linear algebra
nalgebra = "0.35"
cgmath = "0.18"

# numer handling
num-traits = "0.2.19"

# Faster hash map for uniform grid
rustc-hash = "2.1.1"

# command line parser
clap = {version = "4.5.51", features = ["derive"] }

# for communication between threads
crossbeam = "0.8.4"

# native file dialogs
rfd = "0.15"

# parsing file content
serde = { version = "1.0", features = ["derive"] }

# storing struct in the RON format
ron = "0.12"

# storing measurement data
csv = "1.4"

# loading .toml files
toml = "1.1"

# writing to binary files
bincode = "2.0"

# load sphere for visualization
tobj = { version = "4.0.3", default-features = false, features = ["async"]}

bytemuck = { version = "1.24.0", features = [ "derive" ] }

pollster = "0.4.0"

# logging
tracing = { version = "0.1.41"}
tracing-subscriber = { version = "0.3.20"}

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
# Remove features if not needed.
features = [
    # About widget for the app
    "about",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Markdown widget
    "markdown",
    # QR code widget
    "qr_code",
    # GPU-accelerated rendering
    "wgpu",
    # xdg portal dialogs on Linux
    "xdg-portal"
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
