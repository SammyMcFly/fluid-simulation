[package]
name = "rusty_fluid_solver"
version = "0.1.0"
edition = "2024"

[features]
# Default-Features: werden automatisch aktiv, wenn nichts anderes angegeben ist
# default = ["logging", "global_pressure"]
default = ["logging", "parallel", "global_pressure"]

# Features
logging = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender"]
parallel = ["dep:rayon"]
implicit_euler = ["springs"]
springs = []
pseudo_mass_boundary = []
local_pressure = []
splitting = ["local_pressure"]
global_pressure = []

# [dev-dependencies]
# criterion ={ version = "0.5.1", features = ["html_reports"] }

# [[bench]]
# name = "bench_System1D_inc_time"
# harness = false

# for profiling with flamegraph
# [profile.release]
# debug = true

[dependencies]
# linear algebra
nalgebra = "0.34.1"
cgmath = "0.18"

# numer handling
num-traits = "0.2.19"

# Faster hash map for uniform grid
rustc-hash = "2.1.1"

# command line parser
clap = {version = "4.5.51", features = ["derive"] }

# parsing file content
serde = { version = "1.0", features = ["derive"] }

# storing struct in the RON format
ron = "0.11"

# storing measurement data
csv = "1.4"

# loading .toml files
toml = "0.9"

# visualization
## iced = "0.13.1"
iced_widget = { git = "https://github.com/iced-rs/iced", rev = "7a97773f1796fa7889435c78305d287449dd05a4",  package = "iced_widget", features = ["wgpu"]}
iced_wgpu = { git = "https://github.com/iced-rs/iced", rev = "7a97773f1796fa7889435c78305d287449dd05a4", package = "iced_wgpu" }
iced_winit = { git = "https://github.com/iced-rs/iced", rev = "7a97773f1796fa7889435c78305d287449dd05a4", package = "iced_winit" }

## load sphere for visualization
tobj = { version = "4.0.3", default-features = false, features = ["async"]}

bytemuck = { version = "1.24.0", features = [ "derive" ] }

pollster = "0.4.0"

anyhow = "1.0.100"
fs_extra = "1.3"
glob = "0.3.3"

# optional
## logging
tracing = { version = "0.1.41", optional = true }
tracing-subscriber = { version = "0.3.20", optional = true }
tracing-appender = { version = "0.2.3", optional = true }

## multithreading of for loops
rayon = { version = "1.11", optional = true }
