[package]
name = "rendering_lib"
version = "0.1.0"
edition = "2024"

[features]
default = []

# Features
logging = ["dep:tracing"]

[dependencies]
# my rendering library
simulation_lib = { path = "../simulation_lib" }

# simulation backend
simulation_backend = { path = "../simulation_backend"}

# linear algebra
nalgebra = "0.35"
cgmath = "0.18"

# numer handling
num-traits = "0.2.19"

# Faster hash map for uniform grid
rustc-hash = "2.1.1"

# tobj hash map
ahash = "0.8"

# for communication between threads
crossbeam = "0.8.4"

# parsing file content
serde = { version = "1.0", features = ["derive"] }

# storing struct in the RON format
ron = "0.12"

# storing measurement data
csv = "1.4"

# loading .toml files
toml = "1.1"

# writing to binary files
bincode = "2.0"

# visualization
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["wgpu"] }

## load sphere for visualization
tobj = { version = "4.0.3", default-features = false, features = ["async"]}
bytemuck = { version = "1.24.0", features = [ "derive" ] }
pollster = "0.4.0"

# colormap
colorous = "1.0.16"

# image processing
image = "0.25"

# optional
## logging
tracing = { version = "0.1.41", optional = true }
