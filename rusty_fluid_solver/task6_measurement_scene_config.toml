# Scene configuration file

[parameters]
buffer_length_limit = 1000
rest_density = 900.0 # rest density of fluid
rest_density_grid_spacing = 0.8 # (not hot swappable)
kernel_support_radius = 1.6 # (not hot swappable)
disable_particles_below = -30
fluid_viscosity = 0.2
boundary_viscosity = 0.2
boundary_pressure_acceleration_weighting = 0.7 # gamma
boundary_rest_volume_weighting = 1.0 # gamma

# constant time step
time_increment = 0.01
# cfl time step
max_time_increment = 0.01
cfl_number = 0.4

# local pressure
stiffness = 80000000.0 # k
# global pressure
# solver_iterations = 10 # deprecated
target_density_error = 0.1 # in percent
relaxation_factor = 0.5 # omega
min_diagonal_element = 1e-12 # epsilon

# [parameters.termination_condition]
# type = "AfterIteration"
# value = 5
# # type = "TargetDensityError"
# # value = 0.1 # in percent

[light]
position = [ 2.0, 2.0, 50.0 ] # (not hot swappable)

[scene]
type = "NoLidCube"

[scene.parameters.particles]
n_particles_x = 9
n_particles_y = 9
n_particles_z = 25 # 25, 50
x_offset = 0.9
y_offset = 0.9
z_offset = 0.9
particle_spacing = 0.805

[scene.parameters.boundary_particles]
n_floor_particles_x = 12
n_floor_particles_y = 12
n_floor_particles_z = 1
wall_height = 100 # wall is at the edge but above floor
x_wall_thickness = 1
y_wall_thickness = 1
x_offset = 0.0
y_offset = 0.0
z_offset = 0.0
particle_spacing = 0.8
