[scene.boundary_particles]
n_floor_particles_x = 60
n_floor_particles_y = 60
n_floor_particles_z = 5
wall_height = 30 # wall is at the edge but above floor
x_wall_thickness = 2
y_wall_thickness = 2
x_offset = -10.0
y_offset = -10.0
z_offset = -12.0
particle_spacing = 0.7

[springs]

[scene.light]
position = [ 2.0, 30.0, 2.0 ] # (not updatable)