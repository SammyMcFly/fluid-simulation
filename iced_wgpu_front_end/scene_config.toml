# Scene configuration file

[params] # Implement as UI controls
buffer_length_limit = 3000 # 3000
time_inc = 0.01
viscosity = 3.0
stiffness = 10.0
integration_scheme = "EulerCromer" # Not implemented yet
# Options: ExplicitEuler, ImplicitEuler, EulerCromer, Verlet,
particle_mass = 0.001
particle_diameter = 0.8 # (does not update visualization yet)
disable_particles_below = -30

[scene.particles]
n_particles_x = 30
n_particles_y = 30
n_particles_z = 20
x_offset = -5.0
y_offset = -4.0
z_offset = 0.0
